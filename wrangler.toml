name = "king-of-farmer-telegram-test"
main = "src/worker.js"
compatibility_date = "2026-10-14"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/health", "/api/*", "/telegram/webhook", "/admin/*"]

# Replace the placeholder with the real D1 database ID from Cloudflare > D1 > king_test.
# Keep binding name DB exactly as configured in the Worker dashboard.
[[d1_databases]]
binding = "DB"
database_name = "king_test"
database_id = "PASTE_REAL_D1_DATABASE_ID_HERE"
