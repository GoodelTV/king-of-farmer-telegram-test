name = "king-of-farmer-test"
main = "src/worker.js"
compatibility_date = "2026-10-10"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/health", "/api/*", "/telegram/webhook"]

[[d1_databases]]
binding = "DB"
database_name = "king-of-farmer-test-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
